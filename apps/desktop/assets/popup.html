<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; base-uri 'none'; form-action 'none'" />
  <title>QR code</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>QR code</h1>
    <button id="close" type="button" aria-label="Close">&times;</button>
  </header>
  <main id="image"></main>
  <div id="version" hidden>
    <span id="versionNote"></span>
    <button id="toggleVersion" type="button"></button>
  </div>
  <footer id="details"></footer>
  <script src="popup.js"></script>
</body>
</html>
