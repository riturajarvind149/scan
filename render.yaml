# One-click deploy of the internet relay on Render: https://render.com/docs/blueprint-spec
# Runs on the free plan. Its disk is wiped on restart: RELAY_SECRET keeps every credential valid, and
# Upstash (free, set up separately) keeps the laptop list and removals.
# The instance sleeps when idle, so the first request after a quiet spell can take about a minute.
services:
  - type: web
    name: qr-to-windows-relay
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: RELAY_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
