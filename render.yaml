# One-click deploy of the internet relay on Render: https://render.com/docs/blueprint-spec
# Runs on the free plan. Its disk is wiped on restart, which is fine: RELAY_SECRET keeps every device's
# credential valid, and laptops re-send the phones you removed when they reconnect.
# The instance sleeps when idle, so the first request after a quiet spell can take about a minute.
services:
  - type: web
    name: qr-to-windows-relay
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: RELAY_SECRET
        generateValue: true
